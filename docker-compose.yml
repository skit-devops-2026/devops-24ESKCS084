services:
  craftcv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${GIT_COMMIT:-local-dev}
    image: craftcv:latest
    container_name: craftcv-app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: craftcv-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: craftcv-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - craftcv
      - blackbox-exporter
