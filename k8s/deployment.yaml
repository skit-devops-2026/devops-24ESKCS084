apiVersion: apps/v1
kind: Deployment
metadata:
  name: craftcv-deployment
  labels:
    app: craftcv
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: craftcv
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: craftcv
        tier: frontend
    spec:
      containers:
        - name: craftcv
          image: ghcr.io/skit-devops-2026/devops-24eskcs084-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
